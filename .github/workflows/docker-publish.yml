name: Docker

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

on:
  push:
    branches: [ main ]
    # Publish semver tags as releases.
    tags: [ 'backend/v*.*.*' ]
  pull_request:
    branches: [ main ]

env:
  # Use docker.io for Docker Hub if empty
  REGISTRY: ghcr.io
  # github.repository as <account>/<repo>
  IMAGE_NAME: ${{ github.repository }}


jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - context: ./server
            image: ghcr.io/teamhanko/passkey-server
    permissions:
      contents: read
      packages: write
      # This is used to complete the identity challenge
      # with sigstore/fulcio when running outside of PRs.
      id-token: write

    steps:
      # Fail early on malformed release tags. Without this, a tag that does not
      # match the pattern in the metadata step below would silently produce no
      # tags at all. Keep both patterns in sync.
      - name: Validate release tag
        if: github.ref_type == 'tag'
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^backend/v[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || { echo "::error::Tag '$GITHUB_REF_NAME' does not match backend/vX.Y.Z"; exit 1; }

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v4

      # Login against a Docker registry except on PR
      # https://github.com/docker/login-action
      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Extract metadata (tags, labels) for Docker
      # https://github.com/docker/metadata-action
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ matrix.image }}
          tags: |
            type=schedule
            type=ref,event=branch,suffix=-{{sha}}-{{date 'YYYY-MM-DD.HHmmss'}}
            type=match,pattern=^backend/(v\d+\.\d+\.\d+)$,group=1,event=tag
            type=ref,event=pr

      - name: Determine server version
        id: version
        run: |
          version="dev-$GITHUB_SHA"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#backend/}"
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      # Build and push Docker image with Buildx (don't push on PR)
      # https://github.com/docker/build-push-action
      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v7
        with:
          platforms: linux/amd64,linux/arm64
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          sbom: true
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Install Syft
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/syft"
          cd "$RUNNER_TEMP/syft"
          gh release download v1.51.0 --repo anchore/syft \
            --pattern syft_1.51.0_linux_amd64.tar.gz --pattern syft_1.51.0_checksums.txt
          sha256sum --check --ignore-missing syft_1.51.0_checksums.txt
          tar -xzf syft_1.51.0_linux_amd64.tar.gz syft
          echo "$RUNNER_TEMP/syft" >> "$GITHUB_PATH"

      # Customer SBOMs are separate scans of the same immutable image, with
      # Go license enrichment. The original BuildKit attestations stay intact.
      - name: Generate release SBOMs with Go license information
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          IMAGE: ${{ matrix.image }}
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
          VERSION: ${{ steps.version.outputs.value }}
          SYFT_CHECK_FOR_APP_UPDATE: 'false'
          SYFT_GOLANG_SEARCH_REMOTE_LICENSES: 'true'
          SYFT_GOLANG_PROXY: https://proxy.golang.org
          # Preserve evidence for non-standard LicenseRef entries in SPDX.
          SYFT_LICENSE_CONTENT: 'unknown'
        run: |
          mkdir -p sbom
          for arch in amd64 arm64; do
            syft scan "registry:$IMAGE@$DIGEST" --platform "linux/$arch" \
              --source-name passkey-server --source-version "$VERSION" \
              --override-default-catalogers image,file \
              --output spdx-json | jq . > "sbom/passkey-server-$VERSION-linux-$arch.spdx.json"
            if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
              jq -e --arg version "$VERSION" \
                '[.packages[] | select(.name == "github.com/teamhanko/passkey-server")] |
                 length == 1 and (.[0].versionInfo == $version)' \
                "sbom/passkey-server-$VERSION-linux-$arch.spdx.json" > /dev/null
            fi
          done
          printf '%s\n' "$IMAGE@$DIGEST" > sbom/image.txt
          cp LICENSE sbom/LICENSE

      - name: Upload SBOM artifacts
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: passkey-server-sbom
          path: sbom/
          if-no-files-found: error
