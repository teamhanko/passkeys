name: Go

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: server/go.mod

    - name: Build
      working-directory: ./server
      run: |
        go generate ./...
        go build -v ./...

    - name: Test
      working-directory: ./server
      run: go test -v ./...
